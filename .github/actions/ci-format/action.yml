name: "CI Format"
description: |
  Validates .NET code formatting against the canonical .editorconfig from CI_Toolkit.
  Skips when no format-relevant files changed.

inputs:
  app_id:
    description: GitHub App client ID for cross-org token minting.
    required: false
    default: ""
  private_key:
    description: GitHub App PEM private key.
    required: false
    default: ""
  fallback_token:
    description: Fallback token when App credentials are absent.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout caller repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
      with:
        dotnet-version: '8.0'

    - name: Compute changed files
      id: changed
      uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/compute-changed-files@capture/dataset-baseline
      with:
        patterns: '*.cs *.csproj *.props *.targets'
        output_file: changed_dotnet_files.txt

    # Fetch the format script and canonical .editorconfig from CI_Toolkit
    # rather than the caller repo so the formatting standard is uniform.
    - name: Checkout CI_Toolkit (format script)
      if: steps.changed.outputs.count != '0'
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: BHoM/CI_Toolkit
        ref: develop
        path: _toolkit

    - name: Check formatting (changed files only)
      if: steps.changed.outputs.count != '0'
      shell: bash
      run: bash _toolkit/.github/scripts/check-format-pr.sh
