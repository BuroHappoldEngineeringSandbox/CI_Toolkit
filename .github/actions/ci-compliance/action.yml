name: "CI Compliance"
description: |
  Runs one BHoM compliance check (code | copyright | documentation | project
  | dataset) over the changed files, building the Test_Toolkit dependency
  graph and the matching compliance runner first. Skips when no relevant
  files changed.

inputs:
  check_type:
    description: "Compliance check to run: code | copyright | documentation | project | dataset"
    required: true
  patterns:
    description: Space-separated git pathspecs for files relevant to this check type.
    required: true
  test_toolkit_repo:
    description: Test_Toolkit repository (owner/repo). Override to point at a fork.
    required: false
    default: 'BHoM/Test_Toolkit'
  deps_dotnet_version:
    description: .NET SDK version that builds the Test_Toolkit dep graph (net8.0).
    required: false
    default: '8.0'
  runner_dotnet_version:
    description: .NET SDK version that publishes the compliance runner (net10.0).
    required: false
    default: '10.x'
  app_id:
    description: GitHub App client ID for cross-org token minting.
    required: false
    default: ""
  private_key:
    description: GitHub App PEM private key.
    required: false
    default: ""
  fallback_token:
    description: Fallback token when App credentials are absent.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout caller repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Compute changed files
      id: changed
      uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/compute-changed-files@capture/dataset-baseline
      with:
        patterns: ${{ inputs.patterns }}
        output_file: changed_files.txt

    - name: Mint dependency token
      id: dep-token
      if: steps.changed.outputs.count != '0'
      uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/mint-dep-token@capture/dataset-baseline
      with:
        app_id:         ${{ inputs.app_id }}
        private_key:    ${{ inputs.private_key }}
        fallback_token: ${{ inputs.fallback_token || github.token }}

    - name: Resolve dependencies (Test_Toolkit graph)
      if: steps.changed.outputs.count != '0'
      uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/resolve-dependencies@capture/dataset-baseline
      with:
        mode:           seeds
        seeds:          ${{ inputs.test_toolkit_repo }}
        dotnet_version: ${{ inputs.deps_dotnet_version }}
        configuration:  Release
        token:          ${{ steps.dep-token.outputs.token }}

    - name: Resolve runner project
      id: runner-project
      if: steps.changed.outputs.count != '0'
      shell: bash
      run: |
        if [ "${{ inputs.check_type }}" = "dataset" ]; then
          echo "path=tools/ComplianceRunner/src/DatasetComplianceRunner/DatasetComplianceRunner.csproj" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=dataset-runner" >> "$GITHUB_OUTPUT"
        else
          echo "path=tools/ComplianceRunner/src/ComplianceRunner/ComplianceRunner.csproj" >> "$GITHUB_OUTPUT"
          echo "cache_prefix=compliance-runner" >> "$GITHUB_OUTPUT"
        fi

    # CodeComplianceTest_Engine.dll (from Test_Toolkit) is bundled into the
    # ComplianceRunner output via Private=true. The runner cache key must
    # therefore include Test_Toolkit's SHA; otherwise StartOfMilestoneCommand
    # version bumps are silently ignored until the cache expires.
    - name: Read Test_Toolkit SHA for cache key
      id: tt-sha
      if: steps.changed.outputs.count != '0'
      shell: bash
      run: |
        sha=""
        if [ -f "deps/_shas.txt" ]; then
          sha=$(grep '^${{ inputs.test_toolkit_repo }} ' deps/_shas.txt | awk '{print $2}' || true)
        fi
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - name: Prepare runner
      if: steps.changed.outputs.count != '0'
      id: runner
      uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/prepare-runner@capture/dataset-baseline
      with:
        runner_project: ${{ steps.runner-project.outputs.path }}
        output_dir:     out\runner
        configuration:  Release
        cache_prefix:   ${{ steps.runner-project.outputs.cache_prefix }}-tt${{ steps.tt-sha.outputs.sha }}
        dotnet_version: ${{ inputs.runner_dotnet_version }}  # both runners target net10.0

    - name: Run ${{ inputs.check_type }} compliance
      id: run_check
      if: steps.changed.outputs.count != '0'
      shell: pwsh
      run: |
        $runnerExe = "${{ steps.runner.outputs.runner_exe }}"
        $orgUrl    = "${{ github.server_url }}/${{ github.repository }}"
        $fileList  = @(Get-Content changed_files.txt)
        $check     = "${{ inputs.check_type }}"

        if ($fileList.Count -eq 0) {
          Write-Host "::warning::changed_files.txt is empty. No files to check."
          exit 0
        }

        Write-Host "::group::BHoM $check compliance"

        # DatasetComplianceRunner has a different CLI shape: no check-type
        # argument, no --org-url, and all positional args are treated as file
        # paths. Branch the invocation accordingly.
        # Tee'd rather than piped straight through: the coverage line has to reach the job
        # summary, and the runner's own stdout is inside the group above, which the UI
        # collapses by default. A count nobody expands is not a count anybody reads.
        if ($check -eq "dataset") {
          $runnerOutput = & $runnerExe --output github @fileList 2>&1
        } else {
          $runnerOutput = & $runnerExe $check --output github --org-url "$orgUrl" @fileList 2>&1
        }
        $exitCode = $LASTEXITCODE

        # Re-emitted verbatim. Capturing is what lets the coverage line reach the summary below;
        # the annotations and workflow commands in this output still have to reach the log, and
        # Write-Host is what puts them there.
        $runnerOutput | ForEach-Object { Write-Host $_ }
        Write-Host "::endgroup::"

        if ($env:GITHUB_STEP_SUMMARY) {
          $status = if ($exitCode -eq 0) { "passed" } else { "**failed**" }

          # One well-defined line the runner controls. Absent rather than fatal if the runner
          # is older than this action, since the two version independently.
          $coverage = $runnerOutput |
                      Where-Object { $_ -match '^Coverage: ' } |
                      Select-Object -First 1

          $summary = @("### $check compliance $status")
          if ($coverage) {
            # Verbatim. Rewording it here would put the same sentence in two places and let
            # them drift; the runner owns the wording and this owns where it appears.
            $summary += ""
            $summary += $coverage
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
        }

        exit $exitCode
