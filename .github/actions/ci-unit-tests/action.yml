name: "CI Unit Tests"
description: |
  Discovers and runs unit tests for the caller repo, generating code coverage reports
  and posting results to the PR.

inputs:
  app_id:
    description: GitHub App client ID for cross-org token minting.
    required: false
    default: ""
  private_key:
    description: GitHub App PEM private key.
    required: false
    default: ""
  fallback_token:
    description: Fallback token when App credentials are absent.
    required: false
    default: ""
  pr_number:
    description: >
      PR number in the caller repo. Proxy workflows pass this so the
      coverage comment targets the right PR in cross-org contexts.
    required: false
    default: ""
  test_toolkit_repo:
    description: >
      Test_Toolkit repository (owner/repo). Override to point at a fork.
    required: false
    default: "BHoM/Test_Toolkit"
  deps_dotnet_version:
    description: >
      SDK for the dependency build, passed through to resolve-dependencies,
      which pins it at its own clone root. Separate from the caller's test
      SDK below: the dependency graph is built on 8.0 fleet-wide and moving
      it is a change of its own.
    required: false
    default: '8.0'
  test_dotnet_version:
    description: >
      SDK pinned for the caller's test build, written to a generated
      global.json at the workspace root. setup-dotnet installs a version but
      does not select it, so without the pin `dotnet test` takes the newest
      SDK on the runner image and the check drifts with every image refresh.
      An `X.Y` value is expanded to `X.Y.100` and pinned with
      `rollForward: latestFeature`, which accepts any feature band and patch
      of that minor and never crosses into another major.
    required: false
    default: '10.0'
  coverage_mode:
    description: >
      PROBE ONLY. coverlet (current behaviour), coverlet-filtered (restrict to
      the assemblies this repository builds) or mscollector (Microsoft's
      collector, Cobertura output, same restriction).
    required: false
    default: 'coverlet'
  external_category:
    description: >
      NUnit category excluded from the run. Tests needing software a hosted
      runner cannot have (Autodesk Robot, Dlubal RFEM 6) carry this category;
      excluding them is reported per project rather than passing silently.
    required: false
    default: 'RequiresExternalSoftware'

runs:
  using: composite
  steps:
    - name: Checkout caller repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 1

    - name: Compute changed files
      id: changed
      uses: BHoM/CI_Toolkit/.github/actions/compute-changed-files@develop
      with:
        patterns: '*.cs *.csproj *.sln *.props *.targets'
        skip_if_not_pr: 'false'

    # Convention: tests live somewhere under .ci/unit-tests. The directory is
    # the contract; its internal layout is not. Projects are selected by being
    # test projects, not by filename and not through a .sln, because neither
    # holds across the fleet: three repos name the project `*_Test.csproj`
    # (singular), two keep the solution a directory deeper, and two have no
    # solution at all.
    - name: Discover test projects
      id: test_check
      if: steps.changed.outputs.count != '0'
      shell: pwsh
      env:
        PROJECT_LIST: ${{ runner.temp }}/ci-unit-tests-projects.txt
      run: |
        $root = ".ci/unit-tests"
        if (-not (Test-Path $root)) {
          Write-Host "::warning title=UnitTests::No .ci/unit-tests directory. Unit test step skipped."
          "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit 0
        }

        # A project is a test project when it can host a test run: the VSTest
        # entry point (Microsoft.NET.Test.Sdk), an NUnit adapter, or an explicit
        # IsTestProject. Source and fixture projects sitting in the same tree
        # carry none of these, which is what keeps them out.
        $candidates = Get-ChildItem -Path $root -Filter "*.csproj" -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

        $projects = @()
        foreach ($c in $candidates) {
          $xml = Get-Content $c.FullName -Raw -ErrorAction SilentlyContinue
          if (-not $xml) { continue }
          if ($xml -imatch 'Include\s*=\s*"Microsoft\.NET\.Test\.Sdk"' -or
              $xml -imatch 'Include\s*=\s*"NUnit3TestAdapter"' -or
              $xml -imatch '<IsTestProject>\s*true\s*</IsTestProject>') {
            $projects += $c.FullName
          }
        }
        $projects = $projects | Sort-Object

        if (-not $projects) {
          Write-Host "::error title=UnitTests::.ci/unit-tests exists but contains no test project. A test project references Microsoft.NET.Test.Sdk or NUnit3TestAdapter, or sets <IsTestProject>true</IsTestProject>."
          exit 1
        }

        $projects | Set-Content -Path $env:PROJECT_LIST -Encoding utf8
        "found=true"                 | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "count=$($projects.Count)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "::notice title=UnitTests::Discovered $($projects.Count) test project(s)"
        foreach ($p in $projects) { Write-Host "  $(Resolve-Path -Relative $p)" }

    # Diagnostic only, never fails the check. Reports where the new selection
    # differs from what the previous .sln-driven implementation would have
    # picked, so a repo whose set changes is visible rather than silent.
    - name: Compare against the solution-driven selection
      if: steps.test_check.outputs.found == 'true'
      shell: pwsh
      env:
        PROJECT_LIST: ${{ runner.temp }}/ci-unit-tests-projects.txt
      run: |
        $new = @(Get-Content $env:PROJECT_LIST | Where-Object { $_ })

        # Exactly the previous behaviour: non-recursive .sln lookup, first
        # match, quoted paths ending in Tests.csproj.
        $slns = Get-ChildItem -Path ".ci/unit-tests" -Filter "*.sln" -ErrorAction SilentlyContinue
        $old  = @()
        if ($slns) {
          $sln    = $slns[0].FullName
          $slnDir = Split-Path $sln -Parent
          $old = @(Select-String -Path $sln -Pattern '"(?<p>[^"]+Tests\.csproj)"' | ForEach-Object {
            $rel = $_.Matches[0].Groups['p'].Value -replace '\\','/'
            $abs = Join-Path $slnDir $rel
            if (Test-Path $abs) { (Resolve-Path $abs).Path }
          })
        }

        $onlyNew = @($new | Where-Object { $old -notcontains $_ })
        $onlyOld = @($old | Where-Object { $new -notcontains $_ })

        if (-not $slns) {
          Write-Host "::notice title=UnitTests::No .sln directly under .ci/unit-tests, so the previous implementation selected nothing here and ran no tests."
        }
        if ($onlyNew) {
          Write-Host "::notice title=UnitTests::Newly discovered, not selected by the solution: $(($onlyNew | ForEach-Object { Split-Path $_ -Leaf }) -join ', ')"
        }
        if ($onlyOld) {
          Write-Host "::warning title=UnitTests::Listed in the solution but not detected as a test project: $(($onlyOld | ForEach-Object { Split-Path $_ -Leaf }) -join ', ')"
        }
        if ($slns -and -not $onlyNew -and -not $onlyOld) {
          Write-Host "::notice title=UnitTests::Selection matches the solution-driven selection."
        }

    - name: Mint dependency token
      id: dep-token
      if: steps.test_check.outputs.found == 'true'
      uses: BHoM/CI_Toolkit/.github/actions/mint-dep-token@develop
      with:
        app_id:         ${{ inputs.app_id }}
        private_key:    ${{ inputs.private_key }}
        fallback_token: ${{ inputs.fallback_token || github.token }}

    - name: Resolve dependencies
      if: steps.test_check.outputs.found == 'true'
      uses: BHoM/CI_Toolkit/.github/actions/resolve-dependencies@develop
      with:
        mode:             caller
        additional_seeds: ${{ inputs.test_toolkit_repo }}
        dotnet_version:   ${{ inputs.deps_dotnet_version }}
        configuration:    Release
        token:            ${{ steps.dep-token.outputs.token }}

    # resolve-dependencies pins the SDK at its own clone root, which governs
    # the dependency build and nothing else. The caller's test build runs in
    # the workspace, so it needs its own pin: setup-dotnet installs a version
    # without selecting it, and the newest SDK on the image wins by default.
    # A repository that ships its own global.json has already made this choice
    # and is left alone.
    - name: Pin SDK for the caller workspace
      if: steps.test_check.outputs.found == 'true'
      shell: pwsh
      env:
        TEST_DOTNET_VERSION: ${{ inputs.test_dotnet_version }}
      run: |
        if (Test-Path "global.json") {
          Write-Host "::notice title=UnitTests::Repository supplies its own global.json; leaving it in place."
          Write-Host (Get-Content "global.json" -Raw)
        } else {
          # `latestFeature` accepts any feature band and patch of the requested
          # minor and refuses to cross a major, so an image refresh that adds a
          # new major does not silently change what built the tests.
          $sdkVersion = $env:TEST_DOTNET_VERSION
          if ($sdkVersion -match '^\d+\.\d+$') { $sdkVersion = "$sdkVersion.100" }
          [ordered]@{ sdk = [ordered]@{ version = $sdkVersion; rollForward = "latestFeature" } } `
            | ConvertTo-Json | Set-Content "global.json" -Encoding utf8
        }
        Write-Host "::notice title=UnitTests::SDK in use: $(dotnet --version)"

    - name: Build the coverage filter from this repository's own projects
      id: covfilter
      if: steps.test_check.outputs.found == 'true'
      shell: pwsh
      env:
        COVERAGE_MODE: ${{ inputs.coverage_mode }}
        SETTINGS_PATH: ${{ runner.temp }}/cov.runsettings
      run: |
        # Assemblies this repository builds, from its own production projects.
        # Anything else the test host loads is a dependency, and is not what
        # this repository's coverage figure should be measured against.
        $own = @(Get-ChildItem -Path . -Filter *.csproj -Recurse -EA SilentlyContinue |
          Where-Object { $p = $_.FullName.Split([IO.Path]::DirectorySeparatorChar); $p -notcontains 'bin' -and $p -notcontains 'obj' -and $p -notcontains '.ci' } |
          ForEach-Object {
            $xml = Get-Content $_.FullName -Raw
            if ($xml -match '<AssemblyName>\s*([^<]+?)\s*</AssemblyName>') { $Matches[1] }
            else { [IO.Path]::GetFileNameWithoutExtension($_.Name) }
          } | Sort-Object -Unique)
        Write-Host "::notice title=Coverage::$($own.Count) assembly name(s) from this repository"
        Write-Host ($own -join ', ')

        $nl = [Environment]::NewLine
        $mode = $env:COVERAGE_MODE
        if ($mode -eq 'coverlet-filtered') {
          $inc = ($own | ForEach-Object { '[' + $_ + ']*' }) -join ','
          $x  = '<RunSettings><DataCollectionRunSettings><DataCollectors>'
          $x += '<DataCollector friendlyName="XPlat code coverage"><Configuration>'
          $x += '<Format>cobertura</Format><Include>' + $inc + '</Include>'
          $x += '</Configuration></DataCollector>'
          $x += '</DataCollectors></DataCollectionRunSettings></RunSettings>'
          Set-Content -Path $env:SETTINGS_PATH -Value $x -Encoding utf8
        } elseif ($mode -eq 'mscollector') {
          $paths = ($own | ForEach-Object { '<ModulePath>.*' + [regex]::Escape($_) + '\.dll$</ModulePath>' }) -join ''
          $x  = '<RunSettings><DataCollectionRunSettings><DataCollectors>'
          $x += '<DataCollector friendlyName="Code Coverage"><Configuration>'
          $x += '<Format>cobertura</Format><CodeCoverage><ModulePaths><Include>'
          $x += $paths
          $x += '</Include></ModulePaths></CodeCoverage>'
          $x += '</Configuration></DataCollector>'
          $x += '</DataCollectors></DataCollectionRunSettings></RunSettings>'
          Set-Content -Path $env:SETTINGS_PATH -Value $x -Encoding utf8
        }
        if (Test-Path $env:SETTINGS_PATH) { Write-Host (Get-Content $env:SETTINGS_PATH -Raw) }
    # Per-project invocation, not `dotnet test <sln>`. BHoM `_Tests.sln` files
    # map every project's `Test|Any CPU` to `Debug|Any CPU`, so a solution-level
    # build silently compiles Debug and the test host (which only has an
    # executable TFM under Test) is never produced. Iterating `.csproj` files
    # honours `--configuration Test` correctly.
    - name: Run tests
      id: run_tests
      if: steps.test_check.outputs.found == 'true'
      shell: pwsh
      env:
        # Tests target net6.0[-windows] but windows-2025 runners ship only
        # .NET 8/9/10. Roll forward is mandatory, otherwise the test host
        # fails to start. `Major` resolves to the lowest available higher
        # major (currently .NET 8) for deterministic behaviour across image
        # refreshes; `LatestMajor` would track the newest installed runtime.
        DOTNET_ROLL_FORWARD: Major
        # The test count is read out of `--list-tests` prose, and VSTest
        # localises that prose to the machine's UI language. Pin it so the
        # markers below are the strings the runner actually prints.
        DOTNET_CLI_UI_LANGUAGE: en
        PROJECT_LIST: ${{ runner.temp }}/ci-unit-tests-projects.txt
        EXTERNAL_CATEGORY: ${{ inputs.external_category }}
        COVERAGE_MODE: ${{ inputs.coverage_mode }}
        SETTINGS_PATH: ${{ runner.temp }}/cov.runsettings
      run: |
        $projects = @(Get-Content $env:PROJECT_LIST | Where-Object { $_ })
        $category = $env:EXTERNAL_CATEGORY
        $filter   = "TestCategory!=$category"

        $buildFailed   = @()   # did not compile
        $undetermined  = @()   # `--list-tests` could not be read
        $noTests       = @()   # compiled, contains no test at all
        $noOutput      = @()   # ran, produced no .trx: runner load failure
        $testFailed    = @()   # at least one test failed
        $allExcluded   = @()   # has tests, every one carries the category
        $noneExecuted  = @()   # tests survived the filter, none of them ran
        $partialNotRun = @()   # some ran, some did not
        $badResults    = @()   # .trx present but carries no counters
        $countMismatch = @()   # listing and run disagree on case expansion
        $rows          = @()
        $ranTotal      = 0

        foreach ($proj in $projects) {
          $name = [IO.Path]::GetFileNameWithoutExtension($proj)

          # Build separately so a compile failure is reported as one, rather
          # than arriving as an opaque non-zero exit from `dotnet test`.
          Write-Host "::group::dotnet build $name"
          dotnet build $proj -c Test --nologo
          $buildExit = $LASTEXITCODE
          Write-Host "::endgroup::"
          if ($buildExit -ne 0) {
            $buildFailed += $name
            $rows += [pscustomobject]@{ Project = $name; Discovered = '-'; Ran = '-'; Excluded = '-'; NotRun = '-'; Failed = '-'; Result = 'build failed' }
            continue
          }

          # Unfiltered discovery count. The run below is filtered, so its TRX
          # cannot tell "no tests here" from "all of them were excluded", and
          # those two need opposite verdicts. `--list-tests` answers it for one
          # extra invocation against an already-built project.
          Write-Host "::group::dotnet test $name --list-tests"
          $listOut = (dotnet test $proj -c Test --no-build --list-tests 2>&1 | Out-String)
          $listExit = $LASTEXITCODE
          Write-Host $listOut
          Write-Host "::endgroup::"

          # Three outcomes to separate, and the shape of the output is the only
          # evidence available:
          #
          #   a real listing   marker, then one indented line per test
          #   no test at all   marker, then an unindented "No test is available"
          #   a broken host    marker, then an exception at column 0 and a trace
          #
          # The marker is printed in all three, so it cannot decide anything on
          # its own. The listing is the contiguous indented block after it, and
          # the diagnostics are judged only on the lines outside that block:
          # a test display name may legitimately contain the word Exception
          # (`LoadAssembliesShouldThrowException`, or a parameterised case
          # rendered as `Throws(System.InvalidOperationException)`), so matching
          # it anywhere in the output would read a healthy project as broken.
          $lines  = $listOut -split "`r?`n"
          $marker = [Array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match 'The following Tests are available' })

          $listing = @()
          if ($marker -ge 0) {
            for ($i = $marker + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch '^\s+\S') { break }
              $listing += $lines[$i]
            }
          }
          $blockEnd = $marker + $listing.Count
          $outside  = @(for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($marker -lt 0 -or $i -le $marker -or $i -gt $blockEnd) { $lines[$i] }
          })

          # VSTest states a zero-test assembly explicitly, unindented.
          $zeroStated = @($lines | Where-Object { $_ -match '^No test is available in ' }).Count -gt 0
          # Test-host failures surface as a TestPlatformException, a stack frame
          # (`   at Namespace.Type.Method(`) or the diagnostic-logs hint, all of
          # them outside the listing block.
          $brokenHost = @($outside | Where-Object {
            $_ -match 'TestPlatformException' -or
            $_ -match '^\s*at [\w.`+<>]+\.[\w`+<>]+\(' -or
            $_ -match 'Please check the diagnostic logs'
          }).Count -gt 0

          $discovered = $listing.Count
          $listRead   = $false
          if ($listExit -eq 0 -and -not $brokenHost) {
            if ($discovered -gt 0)                        { $listRead = $true }
            elseif ($zeroStated)                          { $listRead = $true }
          }

          if (-not $listRead) {
            $undetermined += $name
            $rows += [pscustomobject]@{ Project = $name; Discovered = '?'; Ran = '-'; Excluded = '-'; NotRun = '-'; Failed = '-'; Result = 'count unreadable' }
            continue
          }

          if ($discovered -eq 0) {
            $noTests += $name
            $rows += [pscustomobject]@{ Project = $name; Discovered = 0; Ran = 0; Excluded = 0; NotRun = 0; Failed = 0; Result = 'no tests' }
            continue
          }

          Write-Host "::group::dotnet test $name --filter $filter"
          $covArgs = switch ($env:COVERAGE_MODE) {
            'coverlet-filtered' { @('--collect:XPlat Code Coverage', '--settings', $env:SETTINGS_PATH) }
            'mscollector'       { @('--collect:Code Coverage',       '--settings', $env:SETTINGS_PATH) }
            default             { @('--collect:XPlat Code Coverage') }
          }
          $swProj = [Diagnostics.Stopwatch]::StartNew()
          dotnet test $proj -c Test --no-build --filter $filter `
            @covArgs `
            --logger "trx;LogFileName=$name.trx" --results-directory TestResults
          $exit = $LASTEXITCODE
          $swProj.Stop()
          Write-Host "COVTIME|$name|ms=$($swProj.ElapsedMilliseconds)"
          Write-Host "::endgroup::"

          $trx = Join-Path "TestResults" "$name.trx"
          if (-not (Test-Path $trx)) {
            $noOutput += $name
            $rows += [pscustomobject]@{ Project = $name; Discovered = $discovered; Ran = '-'; Excluded = '-'; NotRun = '-'; Failed = '-'; Result = 'no test output' }
            continue
          }

          $counters = $null
          try {
            [xml]$trxXml = Get-Content $trx
            $counters = $trxXml.TestRun.ResultSummary.Counters
          } catch {
            Write-Host "::debug::TRX for $name did not parse: $($_.Exception.Message)"
          }
          # A results file that parses but carries no counters proves nothing.
          # Reading its absent attributes as zero would make it indistinguishable
          # from "every test carried the category", which is a pass.
          if (-not $counters -or $null -eq $counters.total) {
            $badResults += $name
            $rows += [pscustomobject]@{ Project = $name; Discovered = $discovered; Ran = '-'; Excluded = '-'; NotRun = '-'; Failed = '-'; Result = 'results unreadable' }
            continue
          }
          $total    = [int]$counters.total
          $executed = [int]$counters.executed
          $failedN  = [int]$counters.failed
          $excluded = $discovered - $total

          # A negative figure means the listing and the run disagree on how many
          # cases a parameterised test expands to, so neither the excluded count
          # nor anything derived from it can be trusted for this project.
          if ($excluded -lt 0) {
            Write-Host "::warning title=UnitTests::${name}: the run matched $total tests but only $discovered were listed. The excluded count is not meaningful here, which usually means parameterised cases expand differently in the listing and the run."
            $countMismatch += $name
          }
          # Tests the filter admitted and the run did not execute: inconclusive,
          # ignored, or anything else the adapter declines to run. The `executed`
          # counter is the signal; the dedicated `inconclusive` and `notExecuted`
          # counters stay at 0 for NUnit, so the outcomes cannot be told apart
          # from the summary and do not need to be.
          $notRun      = $total - $executed
          $notRunNames = @($trxXml.TestRun.Results.UnitTestResult |
            Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'Failed' } |
            ForEach-Object { $_.testName })
          $ranTotal += $executed

          if ($exit -ne 0 -or $failedN -gt 0) {
            $testFailed += $name
            $result = 'failed'
          } elseif ($total -eq 0) {
            # Every test carried the category. Nothing ran, and that is the
            # intended outcome rather than a defect.
            $allExcluded += $name
            $result = 'all excluded'
          } elseif ($executed -eq 0) {
            # Tests survived the filter and still none ran. A check that passes
            # here reports green on a project that examined nothing.
            $noneExecuted += [pscustomobject]@{ Name = $name; Discovered = $discovered; NotRun = $notRun }
            $result = 'none executed'
          } else {
            $result = if ($notRun -gt 0) { 'passed, some not run' } else { 'passed' }
          }

          $rows += [pscustomobject]@{ Project = $name; Discovered = $discovered; Ran = $executed; Excluded = $excluded; NotRun = $notRun; Failed = $failedN; Result = $result }

          if ($excluded -gt 0) {
            Write-Host "::notice title=UnitTests::${name}: skipped: $excluded tests require external software"
          }
          if ($executed -gt 0 -and $notRun -gt 0) {
            $partialNotRun += [pscustomobject]@{ Name = $name; NotRun = $notRun; Total = $total; Names = $notRunNames }
            # GitHub truncates an annotation at roughly four thousand characters,
            # and a parameterised fixture can produce hundreds of names. Cap the
            # annotation and keep the full list in the job summary, which has no
            # such limit.
            $shown = @($notRunNames | Select-Object -First 20)
            $tail  = if ($notRunNames.Count -gt $shown.Count) { " and $($notRunNames.Count - $shown.Count) more" } else { "" }
            Write-Host "::warning title=UnitTests::${name}: $notRun of $total tests did not run: $($shown -join ', ')$tail"
          }
        }

        # Per-project table, in the job summary and the log.
        $table = $rows | Format-Table -AutoSize | Out-String
        Write-Host $table
        "### Unit tests"                                                          | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        ""                                                                        | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "Filter: ``$filter``"                                                     | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        ""                                                                        | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "| Project | Discovered | Ran | Excluded | Not run | Failed | Result |"     | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        "|---|---:|---:|---:|---:|---:|---|"                                      | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        foreach ($r in $rows) {
          "| $($r.Project) | $($r.Discovered) | $($r.Ran) | $($r.Excluded) | $($r.NotRun) | $($r.Failed) | $($r.Result) |" |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
        }

        if ($partialNotRun) {
          ""                                                                      | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          "> **Not run.** These tests were admitted by the filter and the runner did not execute them, usually `Assert.Inconclusive` or `[Ignore]`. The check passed on the tests that did run." |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
          ""                                                                      | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          foreach ($p in $partialNotRun) {
            foreach ($t in $p.Names) { "- ``$($p.Name)``: $t" | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          }
        }

        foreach ($n in $allExcluded) {
          Write-Host "::notice title=UnitTests::${n}: every test carries [Category(`"$category`")], so none ran. This is a pass."
        }

        # Only claim category exclusion when category exclusion is what happened.
        # The earlier form fired on `ranTotal -eq 0` alone and so asserted it
        # about a repository whose tests were all inconclusive instead.
        $notJudged   = @('build failed', 'count unreadable', 'no test output', 'results unreadable')
        $ranProjects = @($rows | Where-Object { $notJudged -notcontains $_.Result })
        if ($ranTotal -eq 0 -and $ranProjects.Count -gt 0 -and $allExcluded.Count -eq $ranProjects.Count) {
          Write-Host "::warning title=UnitTests::No test ran in this repository: every discovered test carries [Category(`"$category`")]."
        }

        # A test project with no test is a defect in the project, not a pass.
        # The previous guard compared .trx file counts, which never caught this:
        # `dotnet test` writes a results file with total=0 and exits 0 whether
        # the project is empty or the filter matched nothing. Counters tell the
        # two apart; file presence does not.
        if ($buildFailed)  { Write-Host "::error title=UnitTests::Build failed for project(s): $($buildFailed -join ', ')" }
        foreach ($n in $undetermined) {
          Write-Host "::error title=UnitTests::could not determine test count for $n . ``dotnet test --list-tests`` neither listed a test nor reported that none was available, so the project cannot be judged. This is a fault in the check or in the project's test host, not evidence about its tests."
        }
        if ($noTests)      { Write-Host "::error title=UnitTests::No test found in project(s): $($noTests -join ', ') . The project compiled but declares no test. Remove the project or add tests." }
        foreach ($p in $noneExecuted) {
          Write-Host "::error title=UnitTests::no tests executed in $($p.Name) ($($p.Discovered) discovered, $($p.NotRun) not run). The filter admitted these tests and none of them ran, so this project examined nothing. Tag them [Category(`"$category`")] if they need software a runner cannot have, otherwise fix what is stopping them."
        }
        if ($noOutput)     { Write-Host "::error title=UnitTests::No test output from project(s): $($noOutput -join ', ') . The run produced no .trx, which indicates a runner load failure." }
        if ($badResults)   { Write-Host "::error title=UnitTests::Test results could not be read for project(s): $($badResults -join ', ') . The .trx exists but carries no ResultSummary/Counters, so the run cannot be judged." }
        if ($testFailed)   { Write-Host "::error title=UnitTests::Test runs failed for project(s): $($testFailed -join ', ')" }
        if ($buildFailed -or $undetermined -or $noTests -or $noneExecuted -or $noOutput -or $badResults -or $testFailed) { exit 1 }

    - name: Upload test results (TRX)
      if: always() && hashFiles('TestResults/**/*.trx') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-${{ github.run_id }}
        path: TestResults/
        retention-days: 7

    - name: Generate code coverage report
      id: generate_coverage
      if: always() && hashFiles('TestResults/**/*cobertura.xml') != ''
      continue-on-error: true
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ".config" | Out-Null
        Set-Content -Path ".config/dotnet-tools.json" -Value '{
          "version": 1,
          "isRoot": true,
          "tools": {
            "dotnet-reportgenerator-globaltool": {
              "version": "5.4.4",
              "commands": ["reportgenerator"]
            }
          }
        }'
        dotnet tool restore
        dotnet tool run reportgenerator -- "-reports:TestResults/**/*cobertura.xml" "-targetdir:CodeCoverage" "-reporttypes:MarkdownSummaryGithub;Cobertura"
        Get-Content CodeCoverage/SummaryGithub.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY

    - name: Add Coverage PR Comment
      if: always() && hashFiles('CodeCoverage/SummaryGithub.md') != '' && (github.event_name == 'pull_request' || inputs.pr_number)
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        recreate: false
        path: CodeCoverage/SummaryGithub.md
        number: ${{ inputs.pr_number || github.event.pull_request.number }}
        GITHUB_TOKEN: ${{ steps.dep-token.outputs.token }}
