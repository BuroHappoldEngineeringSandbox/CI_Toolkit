# Unit tests for the .NET runners this repo ships from tools/.
#
# lint-workflows covers the YAML and the bash pathspec suite, but its paths filter
# lists only .github/workflows, .github/actions, .github/scripts and templates. Nothing
# matched tools/**, so a pull request touching only the runners received no checks at
# all: PR #131 reported zero. That left every runner regression test inert, including the
# one added in #131 to stop the System.Drawing.Common reference being dropped as unused.
#
# Two jobs and two ComplianceRunner test projects, deliberately separate.
#
#   dotnet-tests       Hermetic. Checkout, SDK, run. No network beyond NuGet, no BHoM.
#                      SerialiserRunner, VersioningRunner and Compliance.Unit.Tests.
#   compliance-tests   Resolves the Test_Toolkit dependency graph first, so Compliance.Tests
#                      can compile and its entry-point tests can run.
#
# Why the ComplianceRunner suite is split across two projects. Compliance.Unit.Tests compiles
# Annotation.cs, ArgParser.cs, FileFilter.cs and SarifBuilder.cs directly instead of
# project-referencing Compliance.Shared, so it pulls in no BHoM assembly and runs in the
# hermetic job with nothing installed. Compliance.Tests holds everything that cannot: the three
# unit files that take a BHoM type as a parameter, and the integration files that invoke the
# built runner executables.
#
# Why Compliance.Tests needs the second job. Compliance.Shared HintPaths five assemblies out
# of C:\ProgramData\BHoM\Assemblies. Measured on a machine carrying the BHoM installer, four
# resolve and only CodeComplianceTest_oM.dll is missing, because it is built by
# BHoM/Test_Toolkit (CodeCompliance_oM/CodeComplianceTest_oM.csproj) rather than shipped in
# the installer payload. AnnotationConvert.cs then fails CS0234 on BH.oM.Test.CodeCompliance
# and takes the whole project down.
#
# resolve-dependencies in mode: seeds with seed BHoM/Test_Toolkit is exactly what ci-compliance
# already does before prepare-runner publishes ComplianceRunner, and ComplianceRunner.csproj
# HintPaths the same assembly. That path demonstrably works in production, so it works here.
#
# Kept as a separate job rather than extra steps on the first for two reasons. The hermetic
# suite stays fast and stays independent: a resolve-dependencies breakage cannot also suppress
# the runner tests that would catch it, which matters because resolve-dependencies is itself
# one of the actions this repository ships. And a dependency-graph build is minutes where the
# hermetic suite is seconds, so failures stay attributable.
name: Test Tools

on:
  pull_request:
    paths:
      - 'tools/**'
  # The pull request that introduces this file touches only .github/workflows, so it
  # cannot trigger itself. Dispatch is how you validate it before relying on it.
  workflow_dispatch:

concurrency:
  group: test-tools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: dotnet tests
    # windows-latest rather than ubuntu-latest. The runners are Windows-only in
    # production (ProgramData paths, Revit assemblies), and HostDependencyTests asserts
    # a property of the host rather than of the code, so it is only meaningful on the
    # host the runners actually execute on.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Two versions: the Serialiser and Versioning suites target net8.0-windows, matching
      # their runners; Compliance.Unit.Tests targets net10.0, matching ComplianceRunner.
      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: |
            8.0
            10.x

      - name: SerialiserRunner tests
        run: dotnet test tools/SerialiserRunner/src/SerialiserRunner.Tests --nologo

      - name: VersioningRunner tests
        run: dotnet test tools/VersioningRunner/src/VersioningRunner.Tests --nologo

      - name: ComplianceRunner unit tests (BHoM-free)
        run: dotnet test tools/ComplianceRunner/tests/Compliance.Unit.Tests --nologo

  # ComplianceRunner's own suite, including the entry-point characterisation tests. Needs
  # CodeComplianceTest_oM.dll, so it builds the Test_Toolkit graph first. See the header.
  compliance-tests:
    name: ComplianceRunner tests
    runs-on: windows-latest
    # The hermetic job is 15. This one clones and builds Test_Toolkit's graph before it can
    # compile anything, and the assembly cache is keyed per dependency SHA set, so it is cold
    # the first time a branch resolves a new set and the whole graph is built from source.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test_Toolkit is public, so github.token suffices and no App credentials are needed.
      # resolve-dependencies builds with the SDK it is given; ComplianceRunner targets
      # net10.0 and is published by the test host, so both versions are installed below.
      - name: Resolve Test_Toolkit dependency graph
        uses: ./.github/actions/resolve-dependencies
        with:
          mode: seeds
          seeds: BHoM/Test_Toolkit
          dotnet_version: '8.0'
          configuration: Release
          token: ${{ github.token }}

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: '10.x'

      # Fail loudly and specifically if the graph build did not produce the one assembly this
      # job exists to obtain, rather than letting it surface as a bare CS0234 later.
      - name: Assert CodeComplianceTest_oM is present
        shell: pwsh
        run: |
          $dll = 'C:\ProgramData\BHoM\Assemblies\CodeComplianceTest_oM.dll'
          if (-not (Test-Path $dll)) {
            Write-Host "::error title=Test Tools::CodeComplianceTest_oM.dll absent after resolving BHoM/Test_Toolkit. Compliance.Tests cannot compile without it."
            exit 1
          }
          Write-Host "::notice title=Test Tools::CodeComplianceTest_oM.dll present ($([int](Get-Item $dll).Length) bytes)."

      # TEMPORARY PROBE, not for merge. Establishes whether the four assemblies
      # DatasetTestRunner.csproj HintPaths beyond Compliance.Shared's five are present once
      # the Test_Toolkit graph has resolved. Report-only so one run yields the whole picture
      # instead of stopping at the first absence.
      - name: PROBE HintPath presence
        shell: pwsh
        run: |
          $asm = 'C:\ProgramData\BHoM\Assemblies'
          $all = @(Get-ChildItem $asm -Filter *.dll -ErrorAction SilentlyContinue)
          Write-Host "PROBE-COUNT: $($all.Count) assembl(ies) in $asm"
          $all.Name | Sort-Object | ForEach-Object { Write-Host "PROBE-ALL: $_" }
          $needed = @('Data_oM','Serialiser_Engine','UnitTest_Engine','UnitTest_oM',
                      'BHoM','BHoM_Engine','Test_Engine','Test_oM','CodeComplianceTest_oM')
          foreach ($n in $needed) {
            $p = Join-Path $asm "$n.dll"
            if (Test-Path $p) { Write-Host "PROBE-HINT: PRESENT $n ($([int](Get-Item $p).Length) bytes)" }
            else              { Write-Host "PROBE-HINT: ABSENT  $n" }
          }

      # The decisive measurement: file presence is not the same as the reference resolving.
      # continue-on-error so a failure here reports rather than reds the job.
      - name: PROBE build DatasetTestRunner
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tools/ComplianceRunner/src/DatasetTestRunner/DatasetTestRunner.csproj -c Debug --nologo
          Write-Host "PROBE-BUILD-EXIT: $LASTEXITCODE"

      # RunnerFixture invokes the runners with `dotnet run --no-build`, so their output must
      # already exist. `dotnet test` does not produce it: Compliance.Tests has no
      # ProjectReference to either executable project, so only Compliance.Shared and the test
      # assembly get built. RunnerFixture.cs:9-11 claims the solution "is built automatically
      # when running via the test project", which is not true and is why every process-invoking
      # test failed with exit 1 and empty stdout the first time this job ran. Building the
      # solution here satisfies the prerequisite the fixture documents without changing the
      # fixture. Debug, because that is what `dotnet run --no-build` resolves to by default.
      - name: Build the runners (RunnerFixture uses --no-build)
        run: dotnet build tools/ComplianceRunner/Platform.slnx -c Debug --nologo

      - name: ComplianceRunner tests
        run: dotnet test tools/ComplianceRunner/tests/Compliance.Tests --no-build --nologo
